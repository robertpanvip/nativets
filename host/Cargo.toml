[package]
name = "gpui-perryts-host"
version = "0.1.0"
edition = "2024"
description = "GPUI render host for PerryTS-compiled TypeScript frontends (mutation protocol over stdio)"

[dependencies]
gpui-pre = { version = "=0.3.3" }
gpui-pre-platform = { version = "=0.3.3" }
# Real component library for the native widget tags (checkbox/switch/button/
# select/date). Vendored as a git submodule (vendor/gpui-kit @ v0.6.1) and
# consumed via the local path so we build the real upstream source — its
# `gpui` dependency IS gpui-pre (renamed), so both share our pinned 0.3.3
# tree — no forked GPUI.
gpui-component = { path = "../vendor/gpui-kit/crates/component", version = "0.6.1" }
# Lucide icon SVGs (RustEmbed) behind Rating's stars / Spinner's loader icon.
# Without registering `Assets` as the app's AssetSource those icons render
# blank — the components ask GPUI for "icons/…svg" and get nothing.
gpui-kit-assets = { path = "../vendor/gpui-kit/crates/assets", version = "0.6.1" }
# Pulled in explicitly so the adapter layer can use gpui-base primitives
# directly (VirtualList, DatePicker base types, Calendar) rather than only
# through gpui-component's re-exports.
gpui-base = { path = "../vendor/gpui-kit/crates/base", version = "0.6.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
rquickjs = { version = "0.14.0", features = ["std"] }
# Date string parsing for the native DatePicker's controlled `setValue`.
# Already in the graph transitively (via gpui-component), no new download.
chrono = "0.4"
# OS CSPRNG behind crypto.getRandomValues / crypto.randomUUID (bom.rs).
# Already in the graph transitively, so this pulls in no new download.
getrandom = "0.2"

[build-dependencies]
# Compiles the vendored scriptc runtime + the generated program TU with the
# MSVC toolchain (cl.exe) into this binary's static link — see build.rs.
cc = "1"

[profile.dev]
opt-level = 1

# Smallest-exe release profile ("tree-shaken" Rust): fat LTO with one codegen
# unit lets LLVM drop every gpui/gpui-component/rquickjs item the bridge never
# reaches (GPUI is a huge monorepo lib; the retained-tree host uses a small
# slice of it). panic=abort removes the unwinder; strip removes symbols and
# debuginfo from the final PE.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
